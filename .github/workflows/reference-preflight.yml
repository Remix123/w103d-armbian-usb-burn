name: Reference image preflight
run-name: Reference image preflight (${{ inputs.pipeline_id || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      pipeline_id:
        description: "Orchestrator correlation token (leave blank for manual runs)"
        required: false
        type: string
        default: ""
      audit_wifi:
        description: "Extract read-only Wi-Fi/kernel metadata from the pinned reference rootfs"
        required: false
        type: boolean
        default: false
      export_wifi_firmware:
        description: "Export the hash-locked MT7663 W103D ROM patch and N9 v3 firmware"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 
      - name: Download pinned reference ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(jq -r .release_tag config/reference.lock.json)
          asset=$(jq -r .asset_name config/reference.lock.json)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/reference"
      - name: Validate ZIP and image hashes
        run: |
          python3 scripts/validate_reference_zip.py \
            --zip "$RUNNER_TEMP/reference/W103D_Armbian_26.8.1_Server.zip" \
            --lock config/reference.lock.json \
            --output-dir "$RUNNER_TEMP/reference/unpacked" \
            | tee "$RUNNER_TEMP/reference-validation.json"
      - name: Install read-only image inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes mtools e2fsprogs device-tree-compiler abootimg lz4
      - name: Pin and inspect Linux packer
        run: |
          set -euo pipefail
          commit=$(jq -r .khadas_utils_commit config/toolchain.lock.json)
          expected=$(jq -r .packer_sha256 config/toolchain.lock.json)
          url="https://raw.githubusercontent.com/khadas/utils/${commit}/aml-flash-tool/tools/linux-x86/aml_image_v2_packer"
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/aml_image_v2_packer"
          echo "$expected  $RUNNER_TEMP/aml_image_v2_packer" | sha256sum --check
          file "$RUNNER_TEMP/aml_image_v2_packer"
          chmod +x "$RUNNER_TEMP/aml_image_v2_packer"
          "$RUNNER_TEMP/aml_image_v2_packer" -c "$RUNNER_TEMP/reference/unpacked/W103D_Armbian_26.8.1_Server.img" | tee "$RUNNER_TEMP/reference-container-check.log"
          grep -q 'Image check OK' "$RUNNER_TEMP/reference-container-check.log"
          mkdir -p "$RUNNER_TEMP/reference/components"
          "$RUNNER_TEMP/aml_image_v2_packer" -d \
            "$RUNNER_TEMP/reference/unpacked/W103D_Armbian_26.8.1_Server.img" \
            "$RUNNER_TEMP/reference/components" \
            > "$RUNNER_TEMP/reference-unpack.log" 2>&1
      - name: Inspect extracted components and W103D boot chain
        run: |
          python3 scripts/inspect_reference.py \
            --unpacked "$RUNNER_TEMP/reference/components" \
            --legacy-lock config/legacy-reference-components.json \
            --out "$RUNNER_TEMP/reference-layout.json" \
            | tee "$RUNNER_TEMP/reference-inspection-summary.json"
      - name: Audit reference Wi-Fi and kernel metadata
        if: ${{ inputs.audit_wifi || inputs.export_wifi_firmware }}
        run: |
          set -euo pipefail
          sudo apt-get install --yes kmod
          audit_args=(
            --components "$RUNNER_TEMP/reference/components"
            --out "$RUNNER_TEMP/reference-wifi-audit.json"
          )
          if [[ "${{ inputs.export_wifi_firmware }}" == "true" ]]; then
            audit_args+=(
              --export-firmware-dir "$RUNNER_TEMP/reference-wifi-firmware"
              --reference-lock config/reference.lock.json
              --source-run "$GITHUB_RUN_ID"
              --source-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            )
          fi
          python3 scripts/audit_reference_wifi.py "${audit_args[@]}" \
            | tee "$RUNNER_TEMP/reference-wifi-audit-summary.json"
      - name: Verify reference Wi-Fi firmware export
        id: verify_firmware_export
        if: ${{ inputs.export_wifi_firmware }}
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/reference-wifi-firmware"
          test -s "$export_dir/mt7663_n9_v3.bin"
          test -s "$export_dir/mt7663pr2h.bin"
          test -s "$export_dir/manifest.json"
          jq -e '.firmware.export.success == true' "$RUNNER_TEMP/reference-wifi-audit.json"
          n9_hash=$(jq -r '.files[] | select(.name == "mt7663_n9_v3.bin") | .sha256' "$export_dir/manifest.json")
          patch_hash=$(jq -r '.files[] | select(.name == "mt7663pr2h.bin") | .sha256' "$export_dir/manifest.json")
          expected_image=$(jq -r .image_sha256 config/reference.lock.json)
          jq -e --arg image "$expected_image" '
            .reference_image_sha256 == $image and
            ([.files[].name] | sort) == ["mt7663_n9_v3.bin", "mt7663pr2h.bin"]
          ' "$export_dir/manifest.json"
          echo "$n9_hash  $export_dir/mt7663_n9_v3.bin" | sha256sum --check
          echo "$patch_hash  $export_dir/mt7663pr2h.bin" | sha256sum --check
          test "$n9_hash" = "223f73f17f0f986dc4e7167daa6eef14ffb41c713f22d70f9645eb049bdec80a"
          test "$patch_hash" = "534f2152f9b0f48dfcec9c1727b0bab9a3727a655d76d5ec818cc39a55602336"
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-preflight-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reference-container-check.log
            ${{ runner.temp }}/reference-validation.json
            ${{ runner.temp }}/reference-unpack.log
            ${{ runner.temp }}/reference-layout.json
            ${{ runner.temp }}/reference-inspection-summary.json
            ${{ runner.temp }}/reference-wifi-audit.json
            ${{ runner.temp }}/reference-wifi-audit-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload hash-verified reference Wi-Fi firmware
        if: ${{ success() && inputs.export_wifi_firmware && steps.verify_firmware_export.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-wifi-firmware-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reference-wifi-firmware/mt7663_n9_v3.bin
            ${{ runner.temp }}/reference-wifi-firmware/mt7663pr2h.bin
            ${{ runner.temp }}/reference-wifi-firmware/manifest.json
          if-no-files-found: error
          retention-days: 7
